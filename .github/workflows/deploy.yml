name: Deploy

on:
  push:
    branches:
      - master
env:
  BUSYMONKEY_HOST: ${{ vars.BUSYMONKEY_HOST }}
jobs:
  publish-image:
    name: Publish docker image on push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: publish-image-${{ github.ref }}
      cancel-in-progress: true
    env:
      REGISTRY_ADDRESS: ${{ secrets.REGISTRY_ADDRESS }}
      DOCKER_CONFIG: ${{ runner.temp }}/docker-registry
    steps:
      - uses: actions/checkout@v7
      - name: Read image name and version
        shell: bash
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)

          name=$(printf '%s' "$metadata" | jq -er '.packages[0].name | ascii_downcase')
          version=$(printf '%s' "$metadata" | jq -er '.packages[0].version')

          registry="${REGISTRY_ADDRESS%/}"

          if [[ -z "$registry" || "$registry" == *"://"* || "$registry" == *"/"* ]]; then
            echo "REGISTRY_ADDRESS must contain a registry host and optional port" >&2
            exit 1
          fi

          printf 'IMAGE_NAME=%s/%s\n' "$registry" "$name" >> "$GITHUB_ENV"
          printf 'APP_VERSION=%s\n' "${version//+/-}" >> "$GITHUB_ENV"
      - name: Log in to registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          : "${REGISTRY_USERNAME:?Missing REGISTRY_USERNAME secret}"
          : "${REGISTRY_PASSWORD:?Missing REGISTRY_PASSWORD secret}"
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_ADDRESS" \
            --username "$REGISTRY_USERNAME" --password-stdin
      - name: Build and push image
        run: |
          docker build --pull --file CD/Dockerfile \
            --tag "${IMAGE_NAME}:${APP_VERSION}-${GITHUB_REF_NAME}" \
            --tag "${IMAGE_NAME}:latest" .
          docker push "${IMAGE_NAME}:${APP_VERSION}-${GITHUB_REF_NAME}"
          docker push "${IMAGE_NAME}:latest"
      - name: Log out of registry
        if: ${{ always() && env.REGISTRY_ADDRESS != '' }}
        run: docker logout "$REGISTRY_ADDRESS"

  deploy-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1.0.6
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install Dioxus
        run: cargo install dioxus-cli
      - name: Bundle project
        run: dx bundle --release --server --out-dir dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: busymonkey-server
          path: dist/web
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1.0.6
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install Dioxus
        run: cargo install dioxus-cli
      - name: Build project
        run: dx bundle --web --release --out-dir dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: busymonkey-web
          path: dist
  # win msi
  deploy-desktop:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
        include:
          - target: x86_64-pc-windows-msvc
            toolchain: stable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1.0.6
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Dioxus
        run: cargo install dioxus-cli
      - name: Bundle project
        run: dx bundle --release --desktop --package-types "msi" --out-dir dist\bundle
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: busymonkey-x86_64-windows.msi
          path: dist\bundle\*.msi
  # linux (for fedora and ubuntu)
  deploy-desktop-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_type: deb
            distro: ubuntu
            artifact_name: busymonkey-x86_64-ubuntu
            artifact_path: dist/bundle/**/*.deb

          - package_type: rpm
            distro: fedora
            artifact_name: busymonkey-x86_64-fedora
            artifact_path: dist/bundle/**/*.rpm

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rs/toolchain@v1.0.6
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: Cache Dioxus CLI
        id: cache-dioxus
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx
          key: dioxus-cli-0.7.10-ubuntu-22.04-x86_64

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            lld \
            rpm

      - name: Install Dioxus
        if: steps.cache-dioxus.outputs.cache-hit != 'true'
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - name: Bundle ${{ matrix.distro }}
        run: >
          dx bundle
          --release
          --desktop
          --package-types "${{ matrix.package_type }}"
          --out-dir dist/bundle

      - name: Upload ${{ matrix.distro }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
